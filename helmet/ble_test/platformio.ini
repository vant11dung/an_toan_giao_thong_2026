; Project test BLE với điện thoại — KHÔNG cần đấu cảm biến.
; Nạp: pio run -t upload   |   Xem Serial: pio device monitor

[env:ble_test]
platform = espressif32
; ESP32-C3 Super Mini dùng esp32-c3-devkitm-1. Nếu là Lolin C3 Mini thì đổi thành lolin_c3_mini.
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200

build_flags =
    ; Bắt buộc với C3 Mini: không có dòng này thì Serial qua USB không in gì
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

lib_deps =
    h2zero/NimBLE-Arduino @ ^1.4.3
